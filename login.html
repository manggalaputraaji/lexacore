<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXACORE | Login & Daftar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="app.css">
</head>
<body class="page-login">

<div id="neoAlertOverlay"></div>
<div id="neoAlertBox" class="neo-alert">
    <div class="neo-alert-icon" id="neoAlertIcon"></div>
    <div class="neo-alert-content">
        <h4 class="neo-alert-title" id="neoAlertTitle">TITLE</h4>
        <p class="neo-alert-text" id="neoAlertText"></p>
        <div class="neo-alert-btns" id="neoAlertBtns" style="display: none;">
            <button class="btn-alert btn-alert-cancel" id="neoBtnCancel">BATAL</button>
            <button class="btn-alert btn-alert-ok" id="neoBtnOk">OK</button>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center">
    <div class="row w-100 justify-content-center">
        
        <div class="col-md-12 text-center mb-4">
            <img src="logolex.png" alt="Logo" style="max-width: 170px; margin-bottom: 15px;">
            <div id="titleArea">
                <h1 id="mainTitle" style="font-weight: 900; letter-spacing: -2px; text-transform: uppercase; font-size: 50px; margin-bottom: 0;">LEXACORE</h1>
                <p id="mainSub" class="fw-bold text-dark opacity-75">Silakan masuk ke akun Anda</p>
            </div>
        </div>

        <div class="col-md-12 d-flex justify-content-center">
            
            <div id="formContainer" style="width: 100%; max-width: 440px;">
                <div class="neo-tab-list" id="tabsList">
                    <button type="button" class="neo-tab-btn active" id="tabLogin" onclick="toggleForm('login')">Masuk</button>
                    <button type="button" class="neo-tab-btn" id="tabRegister" onclick="toggleForm('register')">Daftar</button>
                </div>

                <div id="loginBox" class="card" style="margin: 0;">
                    <div class="mb-4">
                        <h3 style="font-weight: 900; margin-bottom: 5px; font-size: 24px; text-transform: uppercase;">Masuk</h3>
                        <p style="font-size: 14px; color: #4b5563; font-weight: 600; margin-bottom: 0;">Masukkan username dan password Anda.</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="user" class="form-control" placeholder="Masukkan Username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="pass" class="form-control" placeholder="Masukkan Password" required>
                        </div>
                        <button type="submit" id="btnLogin" class="btn btn-primary mt-2">
                            MASUK
                        </button>
                    </form>
                </div>

                <div id="registerBox" class="card hidden" style="margin: 0;">
                    <div class="mb-4">
                        <h3 style="font-weight: 900; margin-bottom: 5px; font-size: 24px; text-transform: uppercase;">Daftar Akun</h3>
                        <p style="font-size: 14px; color: #4b5563; font-weight: 600; margin-bottom: 0;">Isi data di bawah untuk membuat akun baru.</p>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="regNama" class="form-control" placeholder="Nama Lengkap Anda" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email Aktif</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="noreply@company.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Buat Username</label>
                            <div style="position: relative;">
                                <input type="text" id="regUser" class="form-control" placeholder="Username unik" required>
                                <span id="userStatusIcon" class="status-icon"></span>
                            </div>
                            <div id="userFeedback" class="small mt-1 fw-bold" style="display:none;"></div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Buat Password</label>
                            <input type="password" id="regPass" class="form-control" placeholder="Minimal 6 karakter" required>
                        </div>
                        
                        <button type="submit" id="btnDaftar" class="btn btn-success mt-2">
                            DAFTAR
                        </button>
                    </form>
                </div>

                <div id="otpBox" class="card hidden" style="margin: 0;">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold" style="text-transform: uppercase;">Verifikasi Email</h4>
                        <p class="text-dark small fw-bold mb-0">Kode 6 angka dikirim ke:</p>
                        <p class="small fw-bold text-primary" id="otpEmailDisplay"></p>
                    </div>
                    
                    <div class="otp-wrapper" id="otpContainer">
                        <div class="otp-group">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                        </div>
                        <div class="otp-separator">·</div>
                        <div class="otp-group">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                        </div>
                    </div>
                    
                    <p class="text-center mt-3 small fw-bold">
                        Tidak terima kode? <span class="toggle-link" onclick="resendOTP()">Kirim Ulang</span>
                    </p>
                    <p class="text-center mt-2 small">
                        <span class="toggle-link text-danger" onclick="cancelOTP()">Batal Daftar</span>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
