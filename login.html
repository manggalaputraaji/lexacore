<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXACORE | Login & Daftar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');

        * {
            font-family: "Lexend", sans-serif;
            border-radius: 0 !important;
        }

        body {
            background-color: #dfe5f3;
            background-image: 
                linear-gradient(#c5cbe3 1px, transparent 1px),
                linear-gradient(90deg, #c5cbe3 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            min-height: 100vh;
            margin: 0;
            padding: 60px 15px;
            box-sizing: border-box;
            opacity: 0;
            animation: fadeIn 0.6s forwards;
        }

        .container {
            margin: auto;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #ffffff;
            border: 2px solid #1f2937 !important;
            box-shadow: 8px 8px 0 #1f2937;
            margin: auto;
            position: relative;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0 #1f2937;
        }

        .neo-tab-list {
            display: flex;
            width: 100%;
            border: 2px solid #1f2937;
            box-shadow: 6px 6px 0 #1f2937;
            background: #e2e8f0;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            position: relative;
            z-index: 10;
        }

        .neo-tab-list:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 #1f2937;
        }

        .neo-tab-btn {
            flex: 1;
            padding: 12px 16px;
            font-weight: 900;
            font-size: 15px;
            color: #1f2937;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .neo-tab-btn:first-child {
            border-right: 2px solid #1f2937;
        }

        #tabLogin.active {
            background: #3b82f6;
            color: #fff;
        }

        #tabRegister.active {
            background: #22c55e;
            color: #fff;
        }

        .neo-tab-btn:hover:not(.active) {
            background: #cbd5e1;
        }

        .hidden {
            display: none !important;
        }

        .form-label {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            border: 2px solid #1f2937 !important;
            font-weight: 700;
            padding: 12px;
            margin-bottom: 20px;
            background: #fff;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            box-shadow: 4px 4px 0 #1f2937;
            transform: translate(-2px, -2px);
            border-color: #1f2937 !important;
        }

        .btn-primary, .btn-success {
            border: 2px solid #1f2937 !important;
            font-weight: 900;
            padding: 15px;
            box-shadow: 6px 6px 0 #1f2937;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            color: #fff;
            font-size: 15px;
        }

        .btn-primary { background: #3b82f6; }
        .btn-success { background: #22c55e; }

        .btn-primary:hover, .btn-success:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0 #1f2937;
            color: #fff;
        }

        .btn-primary:active, .btn-success:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #1f2937;
        }

        .toggle-link {
            cursor: pointer;
            color: #1f2937;
            text-decoration: underline;
            font-weight: 900;
        }

        #neoAlertOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }

        .neo-alert {
            border: 2px solid #1f2937;
            box-shadow: 4px 4px 0px #1f2937;
            padding: 16px 20px;
            max-width: 400px;
            width: calc(100% - 50px);
            position: fixed;
            z-index: 9999;
            display: none;
            flex-direction: row;
            align-items: flex-start;
            gap: 14px;
            background: #fff;
            color: #1f2937;
        }

        .neo-alert.notif {
            top: 20px;
            left: 20px;
            animation: slideInLeft 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        @keyframes slideInLeft {
            0%   { transform: translateX(calc(-100% - 30px)); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .neo-alert.default  { background: #dbeafe; border-color: #1f2937; }
        .neo-alert.success  { background: #dcfce7; border-color: #1f2937; }
        .neo-alert.warning  { background: #fef9c3; border-color: #1f2937; }
        .neo-alert.destructive { background: #fee2e2; border-color: #1f2937; }

        .neo-alert.choice {
            background: #fff;
            color: #1f2937;
            padding: 28px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 6px 6px 0px #1f2937;
            flex-direction: column;
            align-items: flex-start;
            max-width: 440px;
            animation: none;
        }

        .neo-alert-icon {
            font-size: 22px;
            flex-shrink: 0;
            margin-top: 1px;
            line-height: 1;
        }

        .neo-alert-content { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .neo-alert-title {
            font-weight: 900;
            font-size: 15px;
            margin: 0;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .neo-alert-text {
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            margin: 0;
            line-height: 1.5;
        }

        .neo-alert-btns { display: flex; justify-content: flex-end; gap: 10px; width: 100%; margin-top: 22px; }
        .btn-alert { padding: 9px 18px; border: 2px solid #1f2937; font-weight: 900; text-transform: uppercase; font-size: 13px; cursor: pointer; transition: 0.15s ease; }
        .btn-alert-ok     { background: #3b82f6; color: #fff;    box-shadow: 3px 3px 0px #1f2937; }
        .btn-alert-cancel { background: #fff;    color: #1f2937; box-shadow: 3px 3px 0px #1f2937; }
        .btn-alert:hover  { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #1f2937; }
        .btn-alert:active { transform: translate(2px,  2px);  box-shadow: 1px 1px 0px #1f2937; }

        .otp-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .otp-group {
            display: flex;
            gap: 8px;
        }

        .otp-separator {
            font-size: 32px;
            font-weight: 900;
            color: #000;
        }
        
        .otp-input {
            width: 50px;
            height: 65px;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            border: 2px solid #1f2937;
            background: #fff;
            transition: all 0.2s ease;
            padding: 0;
            box-shadow: 4px 4px 0 #1f2937;
            appearance: textfield;
            -moz-appearance: textfield;
        }

        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .otp-input:focus {
            outline: none;
            box-shadow: 5px 5px 0 #1f2937;
            transform: translate(-2px, -2px);
        }

        .otp-flip { animation: flipAnim 0.5s ease-in-out forwards; pointer-events: none; }
        .otp-error { border-color: #ef4444 !important; animation: shakeAnim 0.4s ease-in-out; color: #ef4444; }
        .otp-success { border-color: #22c55e !important; background-color: #dcfce7; color: #22c55e; }

        @keyframes flipAnim {
            0% { transform: perspective(400px) rotateY(0); }
            50% { transform: perspective(400px) rotateY(90deg); background-color: #f1f1f1; }
            100% { transform: perspective(400px) rotateY(0); }
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .status-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 900;
            z-index: 10;
            display: none;
        }
        .text-success-custom { color: #28a745; }
        .text-danger-custom { color: #ff2a2a; }
    </style>
</head>
<body>

<div id="neoAlertOverlay"></div>
<div id="neoAlertBox" class="neo-alert">
    <div class="neo-alert-icon" id="neoAlertIcon"></div>
    <div class="neo-alert-content">
        <h4 class="neo-alert-title" id="neoAlertTitle">TITLE</h4>
        <p class="neo-alert-text" id="neoAlertText"></p>
        <div class="neo-alert-btns" id="neoAlertBtns" style="display: none;">
            <button class="btn-alert btn-alert-cancel" id="neoBtnCancel">BATAL</button>
            <button class="btn-alert btn-alert-ok" id="neoBtnOk">OK</button>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center">
    <div class="row w-100 justify-content-center">
        
        <div class="col-md-12 text-center mb-4">
            <img src="logolex.png" alt="Logo" style="max-width: 170px; margin-bottom: 15px;">
            <div id="titleArea">
                <h1 id="mainTitle" style="font-weight: 900; letter-spacing: -2px; text-transform: uppercase; font-size: 50px; margin-bottom: 0;">LEXACORE</h1>
                <p id="mainSub" class="fw-bold text-dark opacity-75">Silakan masuk ke akun Anda</p>
            </div>
        </div>

        <div class="col-md-12 d-flex justify-content-center">
            
            <div id="formContainer" style="width: 100%; max-width: 440px;">
                <div class="neo-tab-list" id="tabsList">
                    <button type="button" class="neo-tab-btn active" id="tabLogin" onclick="toggleForm('login')">Masuk</button>
                    <button type="button" class="neo-tab-btn" id="tabRegister" onclick="toggleForm('register')">Daftar</button>
                </div>

                <div id="loginBox" class="card" style="margin: 0;">
                    <div class="mb-4">
                        <h3 style="font-weight: 900; margin-bottom: 5px; font-size: 24px; text-transform: uppercase;">Masuk</h3>
                        <p style="font-size: 14px; color: #4b5563; font-weight: 600; margin-bottom: 0;">Masukkan username dan password Anda.</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="user" class="form-control" placeholder="Masukkan Username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="pass" class="form-control" placeholder="Masukkan Password" required>
                        </div>
                        <button type="submit" id="btnLogin" class="btn btn-primary mt-2">
                            MASUK
                        </button>
                    </form>
                </div>

                <div id="registerBox" class="card hidden" style="margin: 0;">
                    <div class="mb-4">
                        <h3 style="font-weight: 900; margin-bottom: 5px; font-size: 24px; text-transform: uppercase;">Daftar Akun</h3>
                        <p style="font-size: 14px; color: #4b5563; font-weight: 600; margin-bottom: 0;">Isi data di bawah untuk membuat akun baru.</p>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="regNama" class="form-control" placeholder="Nama Lengkap Anda" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email Aktif</label>
                            <input type="email" id="regEmail" class="form-control" placeholder="noreply@company.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Buat Username</label>
                            <div style="position: relative;">
                                <input type="text" id="regUser" class="form-control" placeholder="Username unik" required>
                                <span id="userStatusIcon" class="status-icon"></span>
                            </div>
                            <div id="userFeedback" class="small mt-1 fw-bold" style="display:none;"></div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Buat Password</label>
                            <input type="password" id="regPass" class="form-control" placeholder="Minimal 6 karakter" required>
                        </div>
                        
                        <button type="submit" id="btnDaftar" class="btn btn-success mt-2">
                            DAFTAR
                        </button>
                    </form>
                </div>

                <div id="otpBox" class="card hidden" style="margin: 0;">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold" style="text-transform: uppercase;">Verifikasi Email</h4>
                        <p class="text-dark small fw-bold mb-0">Kode 6 angka dikirim ke:</p>
                        <p class="small fw-bold text-primary" id="otpEmailDisplay"></p>
                    </div>
                    
                    <div class="otp-wrapper" id="otpContainer">
                        <div class="otp-group">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                        </div>
                        <div class="otp-separator">·</div>
                        <div class="otp-group">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                            <input type="number" class="otp-input" maxlength="1" pattern="\d*">
                        </div>
                    </div>
                    
                    <p class="text-center mt-3 small fw-bold">
                        Tidak terima kode? <span class="toggle-link" onclick="resendOTP()">Kirim Ulang</span>
                    </p>
                    <p class="text-center mt-2 small">
                        <span class="toggle-link text-danger" onclick="cancelOTP()">Batal Daftar</span>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const SHEET_ID = '19aDh5DCRpV0FJzxa7Yw6teAhnRwHOCP-zS3g8-YA_sg';
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyPdkSJW5FTU24YCbOF1jguwpKnA_gGVWy8Iw8yMYLGP-GIrecvZglQWgxiQVszs3NM/exec';

    let pendingData = null;

    function showSwal(icon, title, text) {
        const isChoice = title.includes("TIDAK DITEMUKAN") || title.includes("AKUN SUDAH ADA");

        let variant, emoji;
        if (icon === 'error') {
            variant = 'destructive'; emoji = '⛔';
        } else if (icon === 'warning') {
            variant = 'warning'; emoji = '⚠️';
        } else if (icon === 'success') {
            variant = 'success'; emoji = '✅';
        } else {
            variant = 'default'; emoji = 'ℹ️';
        }

        return new Promise((resolve) => {
            const box = document.getElementById('neoAlertBox');
            const overlay = document.getElementById('neoAlertOverlay');
            const iconEl = document.getElementById('neoAlertIcon');
            const btns = document.getElementById('neoAlertBtns');

            document.getElementById('neoAlertTitle').innerText = title;
            document.getElementById('neoAlertText').innerText = text;
            iconEl.innerHTML = emoji;

            box.className = `neo-alert ${isChoice ? 'choice' : 'notif'} ${variant}`;
            btns.style.display = isChoice ? 'flex' : 'none';
            overlay.style.display = isChoice ? 'flex' : 'none';
            box.style.display = 'flex';

            document.getElementById('neoBtnOk').onclick = () => {
                box.style.display = 'none';
                overlay.style.display = 'none';
                resolve({ isConfirmed: true });
            };

            document.getElementById('neoBtnCancel').onclick = () => {
                box.style.display = 'none';
                overlay.style.display = 'none';
                resolve({ isConfirmed: false });
            };

            if (!isChoice) {
                setTimeout(() => { box.style.display = 'none'; }, 3500);
            }
        });
    }

    function toggleForm(type) {
        const login = document.getElementById('loginBox');
        const reg = document.getElementById('registerBox');
        const otp = document.getElementById('otpBox');
        const sub = document.getElementById('mainSub');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const tabsList = document.getElementById('tabsList');

        login.classList.add('hidden');
        reg.classList.add('hidden');
        otp.classList.add('hidden');
        
        if(tabLogin) tabLogin.classList.remove('active');
        if(tabRegister) tabRegister.classList.remove('active');
        if(tabsList) tabsList.classList.remove('hidden');

        if (type === 'login') {
            login.classList.remove('hidden');
            if(tabLogin) tabLogin.classList.add('active');
            sub.innerText = "Silakan masuk ke akun Anda";
        } else if (type === 'reg' || type === 'register') {
            reg.classList.remove('hidden');
            if(tabRegister) tabRegister.classList.add('active');
            sub.innerText = "Silakan buat akun baru";
        } else if (type === 'otp') {
            otp.classList.remove('hidden');
            if(tabsList) tabsList.classList.add('hidden');
        }
    }

    const otpInputs = document.querySelectorAll('.otp-input');
    
    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length > 1) {
                e.target.value = e.target.value.slice(0, 1);
            }
            if (e.target.value !== '' && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            checkAutoSubmit();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                otpInputs[index - 1].focus();
            }
        });

        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6).split('');
            if (pastedData.length > 0) {
                otpInputs.forEach((inp, i) => {
                    if (pastedData[i]) inp.value = pastedData[i];
                });
                const focusIndex = Math.min(pastedData.length, 6) - 1;
                otpInputs[focusIndex].focus();
                checkAutoSubmit();
            }
        });
    });

    async function checkAutoSubmit() {
        const code = Array.from(otpInputs).map(inp => inp.value).join('');
        if (code.length === 6) {
            otpInputs.forEach(inp => inp.disabled = true);
            for (let i = 0; i < otpInputs.length; i++) {
                otpInputs[i].classList.add('otp-flip');
                await new Promise(r => setTimeout(r, 100));
            }
            await new Promise(r => setTimeout(r, 500)); 
            verifyOTPServer(code);
        }
    }

    async function verifyOTPServer(code) {
        try {
            const res = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({
                    type: "VERIFY_AND_SAVE",
                    otpInput: code,
                    ...pendingData
                })
            });
            const result = await res.json();
            otpInputs.forEach(inp => inp.classList.remove('otp-flip'));

            if (result.success) {
                otpInputs.forEach(inp => inp.classList.add('otp-success'));
                setTimeout(() => {
                    Swal.fire({
                        title: "PENDAFTARAN BERHASIL!",
                        text: "Selamat Datang! Silakan Login.",
                        width: 600,
                        padding: "3em",
                        color: "#716add",
                        background: "#fff url(https://sweetalert2.github.io/images/trees.png)",
                        backdrop: `rgba(0,0,123,0.4) url("https://sweetalert2.github.io/images/nyan-cat.gif") left top no-repeat`,
                        showConfirmButton: false,
                        timer: 2500
                    }).then(() => location.reload());
                }, 500);
            } else {
                otpInputs.forEach(inp => {
                    inp.classList.add('otp-error');
                    inp.disabled = false;
                });
                setTimeout(() => {
                    otpInputs.forEach(inp => {
                        inp.classList.remove('otp-error');
                        inp.value = '';
                    });
                    otpInputs[0].focus();
                }, 500);
            }
        } catch (err) {
            showSwal('error', 'Gagal memverifikasi', 'Terjadi kesalahan sistem.');
            otpInputs.forEach(inp => {
                inp.disabled = false;
                inp.classList.remove('otp-flip');
            });
        }
    }

    function cancelOTP() {
        document.getElementById('registerForm').reset();
        pendingData = null;
        document.getElementById('userStatusIcon').style.display = 'none';
        document.getElementById('userFeedback').style.display = 'none';
        otpInputs.forEach(inp => {
            inp.value = ''; inp.disabled = false;
            inp.classList.remove('otp-flip', 'otp-error', 'otp-success');
        });
        toggleForm('reg');
    }

    async function resendOTP() {
        if (!pendingData) return;
        const linkBtn = document.querySelector('#otpBox .toggle-link');
        linkBtn.textContent = 'Mengirim ulang...';
        linkBtn.style.pointerEvents = 'none';
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ type: "SIGN_UP_OTP", email: pendingData.email })
            });
            setTimeout(() => {
                showSwal('success', 'BERHASIL!', 'Kode baru terkirim!');
                linkBtn.textContent = 'Kirim Ulang';
                linkBtn.style.pointerEvents = 'auto';
            }, 1000);
        } catch (err) {
            showSwal('error', 'GAGAL!', 'Gagal mengirim ulang.');
            linkBtn.textContent = 'Kirim Ulang';
            linkBtn.style.pointerEvents = 'auto';
        }
    }

    document.getElementById('regUser').addEventListener('input', async function(e) {
        const user = e.target.value.trim();
        const icon = document.getElementById('userStatusIcon');
        const fb = document.getElementById('userFeedback');
        if (user.length < 3) {
            icon.style.display = 'none'; fb.style.display = 'none'; return;
        }
        try {
            const res = await fetch(WEB_APP_URL, {
                method: 'POST', body: JSON.stringify({ type: "CHECK_USER", username: user })
            });
            const result = await res.json();
            icon.style.display = 'block'; fb.style.display = 'block';
            if (result.userExists) {
                icon.innerText = '✖'; icon.className = 'status-icon text-danger-custom';
                fb.innerText = 'Username sudah ada!'; fb.className = 'small mt-1 text-danger-custom fw-bold';
            } else {
                icon.innerText = '✔'; icon.className = 'status-icon text-success-custom';
                fb.innerText = 'Username tersedia!'; fb.className = 'small mt-1 text-success-custom fw-bold';
            }
        } catch (err) {}
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnDaftar');
        const email = document.getElementById('regEmail').value;
        const user = document.getElementById('regUser').value;
        btn.disabled = true; btn.innerText = "Mengecek Data...";
        try {
            const checkRes = await fetch(WEB_APP_URL, {
                method: 'POST', body: JSON.stringify({ type: "CHECK_USER", email: email, username: user })
            });
            const check = await checkRes.json();
            if (check.emailExists) {
                const res = await showSwal('info', 'AKUN SUDAH ADA!', 'Email ini sudah terdaftar. Silakan login.');
                if (res.isConfirmed) toggleForm('login');
                btn.disabled = false; btn.innerText = "DAFTAR"; return;
            }
            if (check.userExists) {
                showSwal('error', 'GAGAL!', 'Username sudah dipakai!');
                btn.disabled = false; btn.innerText = "DAFTAR"; return;
            }
            pendingData = {
                nama: document.getElementById('regNama').value,
                email: email, username: user,
                password: document.getElementById('regPass').value
            };
            await fetch(WEB_APP_URL, {
                method: 'POST', body: JSON.stringify({ type: "SIGN_UP_OTP", email: email })
            });
            document.getElementById('otpEmailDisplay').innerText = email;
            toggleForm('otp');
            setTimeout(() => { otpInputs[0].focus(); }, 100);
        } catch (err) {
            showSwal('error', 'Gagal memproses data.', 'DATABASE ERROR.');
        } finally {
            btn.disabled = false; btn.innerText = "DAFTAR";
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value.trim();
        const btn = document.getElementById('btnLogin');
        btn.disabled = true; btn.innerText = "Verifikasi...";
        try {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=UserSiswa`);
            const text = await res.text();
            const json = JSON.parse(text.substr(47).slice(0, -2));
            const rows = json.table.rows;
            const accFound = rows.find(r => r.c[0] && r.c[0].v == u);
            if (!accFound) {
                const res = await showSwal('warning', 'AKUN TIDAK DITEMUKAN!', 'Username belum terdaftar.');
                if (res.isConfirmed) toggleForm('reg');
                btn.disabled = false; btn.innerText = "MASUK";
            } else {
                if (accFound.c[1] && accFound.c[1].v == p) {
                    localStorage.setItem('siswaLogin', u);
                    localStorage.setItem('namaLengkap', accFound.c[2].v);
                    window.location.href = 'dashboard-siswa.html';
                } else {
                    showSwal('error', 'AKSES DITOLAK!', 'Password yang Anda masukkan salah.');
                    btn.disabled = false; btn.innerText = "MASUK";
                }
            }
        } catch (err) {
            showSwal('error', 'DATABASE ERROR!', 'Gagal terhubung ke server.');
            btn.disabled = false; btn.innerText = "MASUK";
        }
    });
</script>
</body>
